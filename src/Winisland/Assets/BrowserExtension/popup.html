<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winisland Player Companion</title>
<link rel="stylesheet" href="popup.css">
<main>
  <div class="mark" aria-hidden="true"><span></span></div>
  <h1>At your fingertips.</h1>
  <p id="status" role="status">Checking your connection…</p>
  <p class="detail">Adjust the current video's own volume from your notch. YouTube and HTML5 players, including embedded films.</p>
  <button id="reconnect" type="button">Reconnect to Winisland</button>
  <p class="privacy">A local connection. No account, browsing history, or page data is saved.</p>
</main>
<script src="popup.js"></script>
</html>
