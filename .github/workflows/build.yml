name: Verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check release version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Winisland/Winisland.csproj)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match project version.' }
      - name: Verify native application on a private desktop
        shell: pwsh
        run: ./scripts/Build.ps1 -Verify
      - name: Verify first-notch startup and player integration
        shell: pwsh
        run: |
          ./scripts/Invoke-Verification.ps1 -ExecutablePath artifacts/verification/candidate/win-x64/Winisland.exe -Suite Startup -OutputDirectory artifacts/startup-verification
          ./scripts/Invoke-Verification.ps1 -ExecutablePath artifacts/verification/candidate/win-x64/Winisland.exe -Suite Spotify -OutputDirectory artifacts/spotify-verification
          node scripts/Verify-BrowserCompanion.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser companion verification failed.' }
          node scripts/Verify-BrowserSafety.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser isolation verification failed.' }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
          }
      - name: Build and verify self-contained installer payload
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Verify
      - name: Verify portable publication after the self-contained build
        shell: pwsh
        run: ./scripts/Build.ps1 -Verify
      - name: Install, rollback, helper-upgrade and uninstall in disposable Windows VM
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/installer/Winisland-Setup-*-win-x64.exe)
          if ($installers.Count -ne 1) { throw 'Expected one release installer.' }
          ./scripts/Verify-Installer.ps1 -InstallerPath $installers[0].FullName -AllowDesktopChanges
      - name: Publish verified installer and checksum
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Publish from the runner that passed every check. Actions artifact
          # storage is optional diagnostic archival, not a release dependency.
          $version = ([xml](Get-Content src/Winisland/Winisland.csproj)).Project.PropertyGroup.Version
          $installer = Join-Path 'dist/installer' "Winisland-Setup-$version-win-x64.exe"
          $expectedHash = ((Get-Content -LiteralPath ($installer + '.sha256') -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Verified installer checksum mismatch.' }
          $evidenceDirectory = 'artifacts/release-evidence'
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          $reportDirectories = @('artifacts/verification', 'artifacts/startup-verification', 'artifacts/spotify-verification', 'artifacts/browser-companion', 'artifacts/browser-safety', 'artifacts/installer-verification')
          foreach ($directory in $reportDirectories) {
            foreach ($file in (Get-ChildItem -LiteralPath $directory -Recurse -File)) {
              if ($file.Extension -notin '.json', '.png', '.log') { continue }
              $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $file.FullName)
              $destination = Join-Path $evidenceDirectory $relative
              New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $destination
            }
          }
          @{ tag = $env:RELEASE_TAG; sourceCommit = $env:GITHUB_SHA; version = $version; installerSHA256 = $actualHash; runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceDirectory 'provenance.json') -Encoding utf8
          Compress-Archive -Path "$evidenceDirectory/*" -DestinationPath "dist/installer/Winisland-Verification-$version.zip"
          $notes = Join-Path 'docs/releases' ($env:RELEASE_TAG + '.md')
          $assets = @(Get-ChildItem dist/installer/* | ForEach-Object FullName)
          $existingRelease = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existingRelease | ConvertFrom-Json).isDraft)) {
              Write-Output 'This version is already published; preserve its assets.'
              exit 0
            }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } elseif (Test-Path -LiteralPath $notes) {
            gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Winisland $($env:RELEASE_TAG.Substring(1))" --notes-file $notes
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Winisland $($env:RELEASE_TAG.Substring(1))" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset publication failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Archive verification evidence
        if: always() && (!startsWith(github.ref, 'refs/tags/v') || failure())
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            artifacts/verification/*.json
            artifacts/verification/*.png
            artifacts/verification/*.log
            artifacts/startup-verification/**
            artifacts/spotify-verification/*.json
            artifacts/browser-companion/*.json
            artifacts/browser-safety/**/*.json
            artifacts/installer-verification/**/*.json
            artifacts/installer-verification/**/*.log
          retention-days: 14
